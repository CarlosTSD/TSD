name: Deploy TSD apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 6 / Rolldown requires ^20.19.0 || >=22.12.0
          node-version: '22.14'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Apresentation_app (landing — root)
        env:
          VITE_BASE: '/TSD/'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm exec -w apps/Apresentation_app -- vite build

      - name: Build crono-app (/crono)
        env:
          VITE_BASE: '/TSD/crono/'
        run: npm exec -w apps/crono-app -- vite build

      - name: Build crono-app-v1.1 (/v1.1)
        env:
          VITE_BASE: '/TSD/v1.1/'
        run: npm exec -w apps/crono-app-v1.1 -- vite build

      - name: Combine dists into _site
        run: |
          mkdir -p _site
          cp -r apps/Apresentation_app/dist/. _site/
          mkdir -p _site/crono
          cp -r apps/crono-app/dist/. _site/crono/
          mkdir -p _site/v1.1
          cp -r apps/crono-app-v1.1/dist/. _site/v1.1/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
